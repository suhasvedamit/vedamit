backend:
  name: github
  repo: suhasvedamit/vedamit
  branch: main
local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "partners"
    label: "Partners"
    description: "Manage the list of trusted partners."
    files:
      - file: "src/data/partners.json"
        label: "Partners List"
        name: "partners_list"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Logo", name: "logoSrc", widget: "image" }
  - name: "founders"
    label: "Founders"
    description: "Manage the founders on the About page."
    files:
      - file: "src/data/founders.json"
        label: "Founders List"
        name: "founders_list"
        fields:
          - label: "Founders"
            name: "founders"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - {
                  label: "Focus / Responsibility",
                  name: "focus",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Initials",
                  name: "initials",
                  widget: "string",
                  required: false,
                }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - {
                  label: "Photo",
                  name: "image",
                  widget: "image",
                  required: false,
                }
              - {
                  label: "LinkedIn URL",
                  name: "linkedin",
                  widget: "string",
                  required: false,
                }
              - label: "Key Areas / Pillars"
                name: "expertise"
                widget: "list"
                required: false
                field: { label: "Pillar", name: "item", widget: "string" }
  - name: "contact"
    label: "Contact Info"
    description: "Manage the contact information."
    files:
      - file: "src/data/contact.json"
        label: "Contact Details"
        name: "contact_details"
        fields:
          - {
              label: "Location",
              name: "location",
              widget: "string",
              required: false,
            }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - {
              label: "LinkedIn URL",
              name: "linkedin",
              widget: "string",
              required: false,
            }
